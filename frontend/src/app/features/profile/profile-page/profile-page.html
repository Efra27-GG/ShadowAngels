<div class="profile-container">

  <h2>Mi Perfil</h2>

  <div *ngIf="message" class="message">
    {{ message }}
  </div>

  <form (ngSubmit)="updateProfile()">

    <label>Nombre</label>
    <input
      type="text"
      [(ngModel)]="user.name"
      name="name"
      required
    />

    <label>Email</label>
    <input
      type="email"
      [(ngModel)]="user.email"
      name="email"
      required
    />

    <label>Rol</label>
    <input
      type="text"
      [value]="user.role"
      disabled
    />

    <button type="submit">
      Guardar cambios
    </button>

  </form>

</div>
