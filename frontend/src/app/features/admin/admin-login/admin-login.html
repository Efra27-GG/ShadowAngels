<div class="admin-login">

  <h2>Admin Login</h2>

  <form (ngSubmit)="login()">

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="email"
      name="email"
      required
    >

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
      name="password"
      required
    >

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Entrando...' : 'Login' }}
    </button>

  </form>

  <p class="error" *ngIf="error">
    {{ error }}
  </p>

</div>
