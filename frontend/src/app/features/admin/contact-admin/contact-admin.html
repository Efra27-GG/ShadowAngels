<app-admin-shell>
  <div class="container py-4 px-0">
    <h2 class="mb-2">Contacto</h2>
    <p class="text-muted mb-4">
      Configura aqui los enlaces y datos de contacto que se usan en el footer y en los botones de venta.
    </p>

    <div *ngIf="loading" class="card shadow-sm p-4 text-center">
      <div class="spinner-border text-dark"></div>
    </div>

    <div *ngIf="!loading" class="card shadow-sm p-4">
      <form [formGroup]="form" (ngSubmit)="submit()" class="contact-admin-form">
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Numero de WhatsApp</label>
            <input class="form-control" formControlName="whatsapp_number" placeholder="525512345678">
            <small class="text-muted">Usa el numero completo con lada. Se limpiaran espacios y simbolos.</small>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Texto visible de WhatsApp</label>
            <input class="form-control" formControlName="whatsapp_label" placeholder="55-1234-5678">
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Instagram</label>
            <input class="form-control" formControlName="instagram" placeholder="https://www.instagram.com/tu_cuenta/">
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Facebook</label>
            <input class="form-control" formControlName="facebook" placeholder="https://www.facebook.com/tu_pagina">
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">TikTok</label>
            <input class="form-control" formControlName="tiktok" placeholder="https://www.tiktok.com/@tu_cuenta">
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Email</label>
            <input class="form-control" formControlName="email" placeholder="contacto@shadowangels.com">
          </div>

          <div class="col-12">
            <label class="form-label">Ubicacion o descripcion</label>
            <input class="form-control" formControlName="location" placeholder="Tianguis: Domingos 8am - 2pm">
          </div>
        </div>

        <button class="btn btn-dark mt-4" type="submit">Guardar cambios</button>
      </form>

      <div *ngIf="successMessage" class="alert alert-success mt-3 mb-0">{{ successMessage }}</div>
      <div *ngIf="errorMessage" class="alert alert-danger mt-3 mb-0">{{ errorMessage }}</div>
    </div>
  </div>
</app-admin-shell>
