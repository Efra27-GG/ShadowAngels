<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      <div class="card shadow-sm p-4">
        <h2 class="mb-4 text-center">Iniciar sesion</h2>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" class="form-control" formControlName="email">
            <div class="text-danger small mt-1" *ngIf="loginForm.controls.email.touched && loginForm.controls.email.hasError('required')">
              El correo es obligatorio.
            </div>
            <div class="text-danger small mt-1" *ngIf="loginForm.controls.email.touched && loginForm.controls.email.hasError('email')">
              Ingresa un correo valido.
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Contrasena</label>
            <input type="password" class="form-control" formControlName="password">
            <div class="text-danger small mt-1" *ngIf="loginForm.controls.password.touched && loginForm.controls.password.hasError('required')">
              La contrasena es obligatoria.
            </div>
          </div>

          <button type="submit" class="btn btn-dark w-100">Entrar</button>
        </form>

        <div *ngIf="errorMessage" class="alert alert-danger mt-3 mb-0">
          {{ errorMessage }}
        </div>

        <p class="text-center mt-3 mb-0">
          No tienes cuenta?
          <a routerLink="/registro">Registrate</a>
        </p>
      </div>
    </div>
  </div>
</div>
