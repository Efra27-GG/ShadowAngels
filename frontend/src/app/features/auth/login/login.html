<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      <div class="card shadow-sm p-4">
        <h2 class="mb-4 text-center">Iniciar sesión</h2>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" class="form-control" formControlName="email">
            <div class="text-danger small mt-1" *ngIf="loginForm.controls.email.touched && loginForm.controls.email.invalid">
              Ingresa un correo válido.
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" formControlName="password">
            <div class="text-danger small mt-1" *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid">
              La contraseña es obligatoria.
            </div>
          </div>

          <button type="submit" class="btn btn-dark w-100">Entrar</button>
        </form>

        <div *ngIf="errorMessage" class="alert alert-danger mt-3 mb-0">
          {{ errorMessage }}
        </div>

        <p class="text-center mt-3 mb-0">
          ¿No tienes cuenta?
          <a routerLink="/registro">Regístrate</a>
        </p>
      </div>
    </div>
  </div>
</div>
