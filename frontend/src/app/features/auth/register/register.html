<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      <div class="card shadow-sm p-4">
        <h2 class="mb-4 text-center">Registro</h2>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" formControlName="name">
            <div class="text-danger small mt-1" *ngIf="registerForm.controls.name.touched && registerForm.controls.name.hasError('required')">
              El nombre es obligatorio.
            </div>
            <div class="text-danger small mt-1" *ngIf="registerForm.controls.name.touched && registerForm.controls.name.hasError('minlength')">
              El nombre debe tener al menos 2 caracteres.
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" class="form-control" formControlName="email">
            <div class="text-danger small mt-1" *ngIf="registerForm.controls.email.touched && registerForm.controls.email.hasError('required')">
              El correo es obligatorio.
            </div>
            <div class="text-danger small mt-1" *ngIf="registerForm.controls.email.touched && registerForm.controls.email.hasError('email')">
              Ingresa un correo valido.
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" formControlName="password">
            <div class="text-danger small mt-1" *ngIf="registerForm.controls.password.touched && registerForm.controls.password.hasError('required')">
              La contraseña es obligatoria.
            </div>
            <div class="text-danger small mt-1" *ngIf="registerForm.controls.password.touched && registerForm.controls.password.hasError('minlength')">
              La contraseña debe tener al menos 6 caracteres.
            </div>
          </div>

          <button type="submit" class="btn btn-dark w-100">Crear cuenta</button>
        </form>

        <div *ngIf="successMessage" class="alert alert-success mt-3 mb-0">
          {{ successMessage }}
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger mt-3 mb-0">
          {{ errorMessage }}
        </div>

        <p class="text-center mt-3 mb-0">
          ¿Ya tienes cuenta?
          <a routerLink="/login">Inicia sesión</a>
        </p>
      </div>
    </div>
  </div>
</div>
