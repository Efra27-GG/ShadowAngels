<div class="container py-4">
  <h2 class="mb-4">Productos para mujer</h2>

  <app-catalog-filters
    *ngIf="!loading"
    [searchTerm]="searchTerm"
    [sortOption]="sortOption"
    [sortOptions]="sortOptions"
    [resultCount]="products.length"
    (searchTermChange)="searchTerm = $event; applyFilters()"
    (sortOptionChange)="sortOption = $event; applyFilters()">
  </app-catalog-filters>

  <div *ngIf="loading" class="text-center py-4">
    <div class="spinner-border text-dark"></div>
  </div>

  <div class="row g-4" *ngIf="!loading">
    <div class="col-12 col-sm-6 col-lg-4" *ngFor="let product of products">
      <app-product-card [product]="product"></app-product-card>
    </div>
  </div>
</div>
