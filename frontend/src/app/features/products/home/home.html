<div class="home-container">
  <section
    class="hero-section text-center"
    [class.hero-section--plain]="!hasHeroImage"
    [style.background-image]="heroBackgroundImage">
    <div class="container hero-section__inner">
      <div class="hero-section__content">
        <h1 class="display-5 fw-bold">{{ hero.title }}</h1>
        <p class="lead mt-3 mb-0">
          {{ hero.subtitle }}
        </p>
      </div>

      <button class="hero-section__scroll" type="button" (click)="scrollToProducts()" aria-label="Ir a productos">
        <span></span>
      </button>
    </div>
  </section>

  <section class="container py-4" id="home-products">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h2 class="mb-1">Productos destacados</h2>
        <p class="text-muted mb-0">Explora nuestro catálogo</p>
      </div>

      <button class="btn btn-outline-dark" (click)="loadProducts()">
        Actualizar
      </button>
    </div>

    <app-catalog-filters
      [searchTerm]="searchTerm"
      [sortOption]="sortOption"
      [sortOptions]="sortOptions"
      [resultCount]="products.length"
      (searchTermChange)="searchTerm = $event; applyFilters()"
      (sortOptionChange)="sortOption = $event; applyFilters()">
    </app-catalog-filters>

    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-dark" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="mt-3 mb-0">Cargando productos...</p>
    </div>

    <div *ngIf="!loading && errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div *ngIf="!loading && !errorMessage && products.length === 0" class="alert alert-secondary text-center">
      No hay productos disponibles por el momento.
    </div>

    <div *ngIf="!loading && !errorMessage && products.length > 0" class="row g-4">
      <div class="col-12 col-sm-6 col-lg-4" *ngFor="let product of products">
        <app-product-card [product]="product"></app-product-card>
      </div>
    </div>
  </section>
</div>
