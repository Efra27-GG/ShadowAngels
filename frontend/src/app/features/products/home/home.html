<div class="home-container">
  <section class="hero-section text-center">
    <div class="container py-5">
      <h1 class="display-5 fw-bold">Bienvenido a ShadowAngels</h1>
      <p class="lead mt-3">
        Descubre nuestros productos, novedades y ofertas especiales.
      </p>
    </div>
  </section>

  <section class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h2 class="mb-1">Productos destacados</h2>
        <p class="text-muted mb-0">Catálogo disponible</p>
      </div>

      <button class="btn btn-outline-dark" (click)="loadProducts()">
        Recargar
      </button>
    </div>

    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-dark" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="mt-3 mb-0">Cargando productos...</p>
    </div>

    <div *ngIf="!loading && errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div *ngIf="!loading && !errorMessage && products.length === 0" class="alert alert-secondary text-center">
      No hay productos disponibles por el momento.
    </div>

    <div *ngIf="!loading && !errorMessage && products.length > 0" class="row g-4">
      <div class="col-12 col-sm-6 col-lg-4" *ngFor="let product of products">
        <app-product-card [product]="product"></app-product-card>
      </div>
    </div>
  </section>
</div>
