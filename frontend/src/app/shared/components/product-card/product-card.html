<div class="card h-100 shadow-sm" *ngIf="product">
  <img
    [src]="imageUrl"
    (error)="onImageError($event)"
    class="card-img-top product-img"
    [alt]="product.name"
  >

  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ product.name }}</h5>
    <p class="card-text small text-muted">{{ product.description }}</p>

    <div class="mb-2">
      <span *ngIf="product.discount > 0" class="text-decoration-line-through me-2">
        ${{ product.price }}
      </span>

      <span class="fw-bold text-dark">
        ${{ product.final_price }}
      </span>
    </div>

    <div class="mb-2" *ngIf="product.discount > 0">
      <span class="badge bg-danger">-{{ product.discount }}%</span>
    </div>

    <div class="mb-3">
      <span class="badge bg-secondary me-1" *ngFor="let size of product.sizes">
        {{ size }}
      </span>
    </div>

    <a class="btn btn-dark mt-auto" [routerLink]="['/producto', product._id]">
      Ver detalle
    </a>
  </div>
</div>
