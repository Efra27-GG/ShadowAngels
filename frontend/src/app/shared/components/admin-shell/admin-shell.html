<div class="admin-shell">
  <aside class="admin-shell__sidebar">
    <div class="admin-shell__sidebar-card">
      <div class="admin-shell__header">
        <h4 class="mb-0">Panel Admin</h4>
        <button type="button" class="admin-shell__toggle" (click)="toggleMobileMenu()">
          {{ mobileMenuOpen ? 'Cerrar' : 'Menu' }}
        </button>
      </div>

      <div class="admin-shell__links" [class.admin-shell__links--open]="mobileMenuOpen">
      <a routerLink="/admin" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }" class="admin-link" (click)="closeMobileMenu()">
        Inicio
      </a>
      <a routerLink="/admin/productos" routerLinkActive="active-link" class="admin-link" (click)="closeMobileMenu()">
        Productos
      </a>
      <a routerLink="/admin/solicitudes" routerLinkActive="active-link" class="admin-link admin-link--with-badge" (click)="closeMobileMenu()">
        <span>Solicitudes</span>
        <span class="admin-link__badge" *ngIf="recentRequestsCount">{{ recentRequestsCount }}</span>
      </a>
      <a routerLink="/admin/notificaciones" routerLinkActive="active-link" class="admin-link" (click)="closeMobileMenu()">
        Notificaciones
      </a>
      <a routerLink="/admin/resenas" routerLinkActive="active-link" class="admin-link admin-link--with-badge" (click)="closeMobileMenu()">
        <span>Reseñas</span>
        <span class="admin-link__badge" *ngIf="recentReviewsCount">{{ recentReviewsCount }}</span>
      </a>
      <a routerLink="/admin/perfil" routerLinkActive="active-link" class="admin-link" (click)="closeMobileMenu()">
        Perfil
      </a>
      <a *ngIf="isSuperAdmin" routerLink="/admin/admins" routerLinkActive="active-link" class="admin-link" (click)="closeMobileMenu()">
        Admins
      </a>
      <a *ngIf="isSuperAdmin" routerLink="/admin/contacto" routerLinkActive="active-link" class="admin-link" (click)="closeMobileMenu()">
        Contacto
      </a>
      <a *ngIf="isSuperAdmin" routerLink="/admin/personalizacion" routerLinkActive="active-link" class="admin-link" (click)="closeMobileMenu()">
        Personalización
      </a>
      </div>
    </div>
  </aside>

  <main class="admin-shell__content">
    <ng-content></ng-content>
  </main>
</div>
